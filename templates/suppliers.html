{% extends 'base.html' %}{% block content %}<h2>Suppliers</h2><div class="card p-3 mb-3"><form method="post" class="row g-2"><div class="col-md-3"><input class="form-control" name="name" placeholder="Supplier name" required></div><div class="col-md-2"><input class="form-control" name="phone" placeholder="Phone"></div><div class="col-md-3"><input class="form-control" name="email" placeholder="Email"></div><div class="col-md-3"><input class="form-control" name="address" placeholder="Address"></div><div class="col-md-1"><button class="btn btn-dark">Add</button></div></form></div><div class="card p-3"><div class="table-responsive"><table class="table"><tr><th>Name</th><th>Phone</th><th>Email</th><th>Address</th><th>Actions</th></tr>{% for x in suppliers %}<tr><td>{{x.name}}</td><td>{{x.phone}}</td><td>{{x.email}}</td><td>{{x.address}}</td><td class="actions"><a class="btn btn-sm btn-outline-primary" href="{{url_for('edit_supplier',item_id=x.id)}}">Edit</a><form method="post" action="{{url_for('delete_supplier',item_id=x.id)}}" class="d-inline" onsubmit="return confirm('Delete this supplier? Historical purchases will remain without supplier name.')"><button class="btn btn-sm btn-outline-danger">Delete</button></form></td></tr>{% else %}<tr><td colspan="5" class="text-center text-muted">No suppliers yet.</td></tr>{% endfor %}</table></div></div>{% endblock %}

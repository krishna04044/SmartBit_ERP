{% extends 'base.html' %}{% block content %}<div class="d-flex justify-content-between align-items-center mb-3"><div><h2>Edit {{entity}}</h2><p class="text-muted mb-0">Update the record and save your changes.</p></div><a href="{{back_url}}" class="btn btn-outline-secondary">← Back</a></div><div class="card p-4" style="max-width:900px"><form method="post" class="row g-3">{% for field in fields %}{% set name=field[0] %}{% set label=field[1] %}{% set typ=field[2] %}<div class="col-md-6"><label class="form-label">{{label}}</label>{% if typ=='select' %}<select name="{{name}}" class="form-select">{% for opt in field[3] %}<option {% if item[name]==opt %}selected{% endif %}>{{opt}}</option>{% endfor %}</select>{% else %}<input class="form-control" name="{{name}}" type="{{typ}}" value="{{item[name] or ''}}" {% if name in ['name','sku','email'] and entity not in ['Sale','Purchase'] %}required{% endif %}>{% endif %}</div>{% endfor %}<div class="col-12"><button class="btn btn-dark">Save Changes</button> <a href="{{back_url}}" class="btn btn-light">Cancel</a></div></form></div>{% endblock %}

{% extends 'base.html' %}{% block content %}<h2>Users & Roles</h2><div class="card p-3 mb-3"><form method="post" class="row g-2"><div class="col-md-2"><input class="form-control" name="name" placeholder="Name" required></div><div class="col-md-3"><input class="form-control" name="email" type="email" placeholder="Email" required></div><div class="col-md-2"><input class="form-control" name="password" type="password" placeholder="Password" required></div><div class="col-md-3"><select class="form-select" name="role">{% for r in roles %}<option>{{r}}</option>{% endfor %}</select></div><div class="col-md-2"><button class="btn btn-dark w-100">Create User</button></div></form></div><div class="card p-3"><div class="table-responsive"><table class="table"><tr><th>Name</th><th>Email</th><th>Role</th><th>Created</th><th>Actions</th></tr>{% for u in users %}<tr><td>{{u.name}}</td><td>{{u.email}}</td><td><span class="badge text-bg-dark">{{u.role}}</span></td><td>{{u.created_at}}</td><td class="actions"><a class="btn btn-sm btn-outline-primary" href="{{url_for('edit_user',item_id=u.id)}}">Edit</a><form method="post" action="{{url_for('delete_user',item_id=u.id)}}" class="d-inline" onsubmit="return confirm('Delete this user?')"><button class="btn btn-sm btn-outline-danger">Delete</button></form></td></tr>{% endfor %}</table></div></div>{% endblock %}

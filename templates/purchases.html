{% extends 'base.html' %}{% block content %}<h2>Purchases</h2><div class="card p-3 mb-3"><form method="post" class="row g-2"><div class="col-md-3"><select class="form-select" name="supplier_id"><option value="">Supplier</option>{% for s in suppliers %}<option value="{{s.id}}">{{s.name}}</option>{% endfor %}</select></div><div class="col-md-3"><select class="form-select" name="product_id" required>{% for p in products %}<option value="{{p.id}}">{{p.name}} — ₹{{p.purchase_price}}</option>{% endfor %}</select></div><div class="col-md-2"><input class="form-control" name="qty" type="number" min="1" value="10"></div><div class="col-md-2"><select class="form-select" name="payment_status"><option>Pending</option><option>Paid</option></select></div><div class="col-md-2"><button class="btn btn-dark w-100">Receive Purchase</button></div></form></div><div class="card p-3"><div class="table-responsive"><table class="table"><tr><th>PO</th><th>Supplier</th><th>Total</th><th>Payment</th><th>Date</th><th>Actions</th></tr>{% for p in purchases %}<tr><td>{{p.po_no}}</td><td>{{p.supplier or '-'}}</td><td>₹{{'%.2f'|format(p.total)}}</td><td>{{p.payment_status}}</td><td>{{p.created_at}}</td><td class="actions"><a class="btn btn-sm btn-outline-primary" href="{{url_for('edit_purchase',item_id=p.id)}}">Edit</a><form method="post" action="{{url_for('delete_purchase',item_id=p.id)}}" class="d-inline" onsubmit="return confirm('Delete this purchase? Received stock will be reversed.')"><button class="btn btn-sm btn-outline-danger">Delete</button></form></td></tr>{% else %}<tr><td colspan="6" class="text-center text-muted">No purchases yet.</td></tr>{% endfor %}</table></div></div>{% endblock %}

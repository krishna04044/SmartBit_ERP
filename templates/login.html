<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SmartBiz ERP - Sign In</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    body {
      background: radial-gradient(circle at 10% 20%, #1e293b 0%, #0f172a 90%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .login-card {
      max-width: 420px;
      width: 100%;
      background: #ffffff;
      border-radius: 1rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      padding: 2.5rem 2rem;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="text-center mb-4">
      <div class="display-6 text-primary mb-2">
        <i class="bi bi-cpu"></i>
      </div>
      <h3 class="fw-bold text-dark mb-1">SmartBiz ERP</h3>
      <p class="text-muted small">Enterprise Resource Planning & Management</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for cat, msg in messages %}
          <div class="alert alert-{{cat}} alert-dismissible fade show small" role="alert">
            {{msg}}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="post">
      <div class="mb-3">
        <label class="form-label small fw-semibold text-muted text-uppercase">Email Address</label>
        <div class="input-group">
          <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope text-muted"></i></span>
          <input class="form-control border-start-0" name="email" type="email" placeholder="admin@smartbiz.com" value="admin@smartbiz.com" required>
        </div>
      </div>

      <div class="mb-4">
        <label class="form-label small fw-semibold text-muted text-uppercase">Password</label>
        <div class="input-group">
          <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
          <input class="form-control border-start-0" name="password" type="password" placeholder="••••••••" value="admin123" required>
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold shadow-sm">
        <i class="bi bi-box-arrow-in-right me-1"></i> Sign In to Dashboard
      </button>
    </form>

    <div class="mt-4 p-3 bg-light rounded text-center small border">
      <div class="text-muted fw-semibold mb-1">Demo Administrator Credentials</div>
      <div class="text-dark font-monospace">admin@smartbiz.com &bull; admin123</div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SmartBiz ERP Login</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><style>body{background:#172033}.box{max-width:420px;margin:10vh auto;background:white;padding:35px;border-radius:18px}</style></head><body><div class="box"><h2 class="fw-bold">SmartBiz ERP</h2><p class="text-muted">Business management platform</p>{% with messages=get_flashed_messages(with_categories=true) %}{% for cat,msg in messages %}<div class="alert alert-{{cat}}">{{msg}}</div>{% endfor %}{% endwith %}<form method="post"><input class="form-control mb-3" name="email" type="email" placeholder="Email" required><input class="form-control mb-3" name="password" type="password" placeholder="Password" required><button class="btn btn-dark w-100">Login</button></form><div class="small text-muted mt-3">Demo: admin@smartbiz.com / admin123</div></div></body></html>
